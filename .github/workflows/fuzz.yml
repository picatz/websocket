name: Fuzz

# Long fuzz runs over every target. The per-push smoke run in test.yml gives
# each of a few targets 15 seconds; this gives every target several minutes.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target (go test -fuzztime)
        default: 10m

permissions:
  contents: read

jobs:
  # Every Fuzz function in the module, found with go test -list, so a new
  # target is fuzzed without editing this file.
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - id: list
        run: |
          matrix=$(
            for dir in $(go list -f '{{.Dir}}' ./...); do
              rel=".${dir#"$PWD"}"
              go test -list '^Fuzz' "$rel" | grep '^Fuzz' | jq -R --arg dir "$rel" '{dir: $dir, target: .}'
            done | jq -cs '{include: .}'
          )
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Fuzz
        env:
          DIR: ${{ matrix.dir }}
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ inputs.fuzztime || '10m' }}
        run: go test "$DIR" -run '^$' -fuzz "^${TARGET}\$" -fuzztime="$FUZZTIME"
      # A failing input is written under the package's testdata/fuzz; keep it
      # so the crash can be reproduced locally with go test -run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: ${{ matrix.dir }}/testdata/fuzz
          if-no-files-found: ignore
          retention-days: 30
