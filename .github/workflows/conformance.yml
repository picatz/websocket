name: Autobahn baseline

on:
  push:
    branches: [main]
    paths:
      - 'conformance/autobahn/**'
      - '.github/workflows/conformance.yml'
      - 'websocket.go'
      - 'extensions.go'
      - 'deflate_negotiation.go'
      - 'go.mod'
  workflow_dispatch:
  pull_request:
    paths:
      - 'conformance/autobahn/**'
      - '.github/workflows/conformance.yml'
      - 'websocket.go'
      - 'extensions.go'
      - 'deflate_negotiation.go'
      - 'go.mod'

permissions:
  contents: read

jobs:
  baseline:
    name: ${{ matrix.role }} / ${{ matrix.profile }} (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role: [server, client]
        profile: [core, compression, limits]
        include:
          - role: server
            profile: compression
            shard_size: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Check harness
        run: |
          test -z "$(gofmt -l conformance/autobahn/cmd)"
          go test -race ./conformance/autobahn/cmd/...
          python3 -m unittest discover -s conformance/autobahn -p 'test_*.py'
      - name: Run isolated baseline
        run: python3 conformance/autobahn/run.py --role '${{ matrix.role }}' --profile '${{ matrix.profile }}' --shard-size '${{ matrix.shard_size || 0 }}' --output '${{ runner.temp }}/autobahn'
      - name: Summarize outcomes
        if: always()
        run: |
          report='${{ runner.temp }}/autobahn/reports/summary.md'
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No complete report: inspect the artifact logs. This is not a conformance pass.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: autobahn-${{ matrix.role }}-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/autobahn
          if-no-files-found: error
          retention-days: 30
