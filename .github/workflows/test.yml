name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=2m ./...
      - run: GOARCH=386 CGO_ENABLED=0 go test -count=1 -timeout=2m ./...
      - run: go test . -run '^$' -fuzz '^FuzzReadMessage$' -fuzztime=15s -parallel=2
      - run: go test . -run '^$' -fuzz '^FuzzExtensionNegotiation$' -fuzztime=15s -parallel=2
      - run: go test . -run '^$' -fuzz '^FuzzUTF8Fragments$' -fuzztime=15s -parallel=2
      - run: go test . -run '^$' -fuzz '^FuzzCanonicalOrigin$' -fuzztime=15s -parallel=2
      - run: go test . -run '^$' -fuzz '^FuzzResponseHeadBound$' -fuzztime=15s -parallel=2
